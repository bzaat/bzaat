  <title id="card-light-t">Concept of the Day for bzaat</title>
  <desc id="card-light-d">Concept of the Day: Intersection over Union (IoU = |A ∩ B| / |A ∪ B|). Measures the overlap between a predicted and a ground-truth box; the standard match criterion in object detection. GitHub: 5 repositories, 1 star, 6 followers, 206 contributions in the last year. Updated 2026-11-21 07:10 UTC.</desc>
