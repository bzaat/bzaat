<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="fb-t fb-d" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif">
  <title id="fb-t">Research case: a field guide to models and methods</title>
  <desc id="fb-d">A worn leather suitcase unlatches and spills golden coins, then a field journal inks in: small-object detection, evidential uncertainty, a from-scratch ResNet-50, suburb-level target encoding, and Vision Transformers as the next topic.</desc>
  <defs>
    <linearGradient id="fb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1D16"/><stop offset="1" stop-color="#17110D"/>
    </linearGradient>
    <linearGradient id="fb-leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#76533F"/><stop offset="1" stop-color="#5C4033"/>
    </linearGradient>
    <radialGradient id="fb-light" cx="50%" cy="100%" r="80%">
      <stop offset="0" stop-color="#FFE7A3" stop-opacity=".95"/><stop offset="1" stop-color="#FFE7A3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .latch { transform-box: fill-box; transform-origin: 50% 0; animation: latch 9s ease-in-out infinite; }
    @keyframes latch { 0%, 14% { transform: rotate(0) } 22%, 88% { transform: rotate(-80deg) } 96%, 100% { transform: rotate(0) } }
    .lid { transform-box: fill-box; transform-origin: 50% 100%; animation: lid 9s ease-in-out infinite; }
    @keyframes lid { 0%, 22% { transform: scaleY(1) } 32%, 86% { transform: scaleY(.35) translateY(-20px) } 96%, 100% { transform: scaleY(1) } }
    .beam { opacity: 0; animation: beam 9s ease-in-out infinite; }
    @keyframes beam { 0%, 24% { opacity: 0 } 34%, 84% { opacity: .9 } 94%, 100% { opacity: 0 } }
    .coin { fill: #D4AF37; stroke: #8C6D12; stroke-width: 1; opacity: 0; animation: coin 9s ease-out infinite; }
    @keyframes coin { 0% { opacity: 0; transform: translate(0, 0) } 8% { opacity: 1 } 30% { opacity: 1; transform: translate(var(--dx), var(--dy)) } 46%, 100% { opacity: 0; transform: translate(var(--dx), calc(var(--dy) + 40px)) } }
    .journal { opacity: 0; animation: journal 9s ease-in-out infinite; }
    @keyframes journal { 0%, 28% { opacity: 0; transform: translateX(16px) } 36%, 90% { opacity: 1; transform: none } 98%, 100% { opacity: 0 } }
    .entry { opacity: 0; animation: entry 9s ease-out infinite; }
    @keyframes entry { 0% { opacity: 0 } 6%, 52% { opacity: 1 } 60%, 100% { opacity: 0 } }
    
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
    @media (prefers-reduced-motion: reduce) { .journal, .entry { opacity: 1 !important; } .beam, .coin { opacity: 0 !important; } }
  </style>
  <rect width="1200" height="360" fill="url(#fb-bg)"/>
  <rect x="10" y="10" width="1180" height="340" rx="10" fill="none" stroke="#D4AF37" stroke-opacity=".35" stroke-dasharray="2 6"/>

  <!-- the case -->
  <ellipse class="beam" cx="290" cy="200" rx="170" ry="120" fill="url(#fb-light)"/>
  <g class="lid"><rect x="150" y="150" width="280" height="54" rx="12" fill="url(#fb-leather)" stroke="#3B281F" stroke-width="3"/>
    <path d="M168 168 H412" stroke="#3B281F" stroke-width="1.5" stroke-dasharray="5 5"/></g>
  <circle class="coin" cx="230" cy="208" r="7.1" style="--dx:19px;--dy:-108px;animation-delay:2.60s"/><circle class="coin" cx="239" cy="208" r="7.4" style="--dx:43px;--dy:-111px;animation-delay:2.72s"/><circle class="coin" cx="291" cy="208" r="5.7" style="--dx:-70px;--dy:-100px;animation-delay:2.84s"/><circle class="coin" cx="305" cy="208" r="5.2" style="--dx:41px;--dy:-89px;animation-delay:2.96s"/><circle class="coin" cx="242" cy="208" r="5.1" style="--dx:70px;--dy:-129px;animation-delay:3.08s"/><circle class="coin" cx="358" cy="208" r="6.8" style="--dx:-65px;--dy:-96px;animation-delay:3.20s"/><circle class="coin" cx="290" cy="208" r="5.3" style="--dx:63px;--dy:-99px;animation-delay:3.32s"/><circle class="coin" cx="228" cy="208" r="7.5" style="--dx:-53px;--dy:-144px;animation-delay:3.44s"/><circle class="coin" cx="282" cy="208" r="6.7" style="--dx:-22px;--dy:-109px;animation-delay:3.56s"/>
  <rect x="150" y="204" width="280" height="110" rx="12" fill="url(#fb-leather)" stroke="#3B281F" stroke-width="3"/>
  <path d="M168 296 H412" stroke="#3B281F" stroke-width="1.5" stroke-dasharray="5 5"/>
  <rect x="246" y="132" width="88" height="22" rx="10" fill="none" stroke="#3B281F" stroke-width="6"/>
  <rect x="190" y="196" width="22" height="22" rx="3" fill="#D4AF37" stroke="#8C6D12"/>
  <rect x="368" y="196" width="22" height="22" rx="3" fill="#D4AF37" stroke="#8C6D12"/>
  <rect class="latch" x="280" y="196" width="20" height="28" rx="4" fill="#D4AF37" stroke="#8C6D12"/>
  <text x="290" y="342" text-anchor="middle" font-size="14" font-style="italic" fill="#BFA98A">P. N. K. Nguyen, research notes</text>

  <!-- the field journal -->
  <g class="journal">
    <rect x="548" y="40" width="612" height="282" rx="6" fill="#F1E3C2" stroke="#5C4033" stroke-width="3" transform="rotate(-1 854 181)"/>
