"#1E6B7B" stroke-width="2" opacity=".75"/><path d="M1036 74 a11 11 0 0 1 22 0" fill="none" stroke="#1E6B7B" stroke-width="2" opacity=".75"/><path d="M1058 74 a11 11 0 0 1 22 0" fill="none" stroke="#1E6B7B" stroke-width="2" opacity=".75"/><path d="M1080 74 a11 11 0 0 1 22 0" fill="none" stroke="#1E6B7B" stroke-width="2" opacity=".75"/><path d="M1102 74 a11 11 0 0 1 22 0" fill="none" stroke="#1E6B7B" stroke-width="2" opacity=".75"/><path d="M1124 74 a11 11 0 0 1 22 0" fill="none" stroke="#1E6B7B" stroke-width="2" opacity=".75"/>
    <text x="574" y="112" font-size="26" font-weight="bold" fill="#2C1E12">Research Field Guide</text>
    <text x="1132" y="112" text-anchor="end" font-size="13" font-style="italic" fill="#6B5537">models &amp; methods, catalogued</text>
    <g transform="translate(574 156)"><g class="entry" style="animation-delay:3.40s"><text x="0" y="0" font-size="18" font-weight="bold" fill="#1E6B7B">Detection</text><text x="128" y="0" font-size="15.5" font-style="italic" fill="#2C1E12">small objects: finds the 10 px shuttlecock</text></g><g class="entry" style="animation-delay:3.85s"><text x="0" y="34" font-size="18" font-weight="bold" fill="#1E6B7B">Uncertainty</text><text x="128" y="34" font-size="15.5" font-style="italic" fill="#2C1E12">evidential learning: knows when to look closer</text></g><g class="entry" style="animation-delay:4.30s"><text x="0" y="68" font-size="18" font-weight="bold" fill="#1E6B7B">ResNet-50</text><text x="128" y="68" font-size="15.5" font-style="italic" fill="#2C1E12">built layer by layer, from scratch</text></g><g class="entry" style="animation-delay:4.75s"><text x="0" y="102" font-size="18" font-weight="bold" fill="#1E6B7B">Encoding</text><text x="128" y="102" font-size="15.5" font-style="italic" fill="#2C1E12">suburb-level target encoding, with controls</text></g><g class="entry" style="animation-delay:5.20s"><text x="0" y="136" font-size="18" font-weight="bold" fill="#1E6B7B">ViT</text><text x="128" y="136" font-size="15.5" font-style="italic" fill="#2C1E12">Vision Transformers: next on the list</text></g></g>
  </g>
