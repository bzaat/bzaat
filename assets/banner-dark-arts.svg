  <desc id="bd-d">Obsidian banner with drifting emerald mist, a slowly turning circle of glowing runes, flickering green curse sparks and rising embers.</desc>
  <defs>
    <radialGradient id="bd-bg" cx="80%" cy="50%" r="90%">
      <stop offset="0" stop-color="#11201A"/><stop offset=".45" stop-color="#0D1013"/><stop offset="1" stop-color="#0B0C10"/>
    </radialGradient>
    <radialGradient id="bd-orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2ECC71" stop-opacity=".9"/><stop offset=".4" stop-color="#2ECC71" stop-opacity=".25"/><stop offset="1" stop-color="#2ECC71" stop-opacity="0"/>
