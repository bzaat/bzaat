# Draws the contribution graph being eaten by a snake, in two theme-matched
# variants, and publishes them to the `output` branch (not main), so main's
# history stays clean. README embeds them from raw.githubusercontent.com.
name: Generate contribution snake

on:
  schedule:
    - cron: "42 0 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write # push to the output branch

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # color_dots: empty cell, then contribution levels 1 to 4
          outputs: |
            dist/snake-light.svg?color_snake=#B8901F&color_dots=#EBEDF0,#CFE8EA,#A8DADC,#D4AF37,#9C7A16
            dist/snake-dark.svg?color_snake=#2ECC71&color_dots=#161B22,#1A472A,#1E7A44,#2ECC71,#C5C6C7

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
